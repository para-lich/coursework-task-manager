<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Менеджер задач</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                TaskFlow
            </div>
            <nav class="menu">
                <a href="#" class="menu-item active">📋 Все задачи</a>
            </nav>
        </aside>

        <!-- Шапка и рабочая область -->
        <main class="main-content">
            <header class="top-header">
                <h1>Менеджер задач</h1>
            </header>

            <!-- Форма добавления -->
            <section class="task-creator">
                <input type="text" id="taskInput" placeholder="Новая задача...">
                <select id="priorityInput">
                    <option value="low">Низкий</option>
                    <option value="medium" selected>Средний</option>
                    <option value="high">Высокий</option>
                </select>
                <button onclick="addTask()" class="primary-btn">Добавить</button>
            </section>

            <!-- Список задач -->
            <section class="task-board">
                <ul id="taskList"></ul>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
